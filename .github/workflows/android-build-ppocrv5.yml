name: Android Build - PaddleOCR PP-OCRv5

on:
  push:
    branches: ["virtual-keyboard", "master", "paddleocr-ppocrv5-integration"]
  pull_request:
    branches: ["virtual-keyboard", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Download PP-OCRv5 models and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Download official PaddleOCR Android SDK source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/PaddlePaddle/PaddleOCR.git /tmp/PaddleOCR
          git -C /tmp/PaddleOCR sparse-checkout set deploy/ppocr-android/ppocr-sdk
          mkdir -p ppocr-sdk
          cp -R /tmp/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src ppocr-sdk/
          cp /tmp/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/AndroidManifest.xml ppocr-sdk/src/main/AndroidManifest.xml
          cat > ppocr-sdk/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.paddle.ocr"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.21.1")
              implementation("com.quickbirdstudios:opencv:4.5.3.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Download and install PP-OCRv5 Mobile ONNX models
        run: |
          set -euo pipefail
          mkdir -p /tmp/ppocr-models ppocr-sdk/src/main/assets/models/det ppocr-sdk/src/main/assets/models/rec
          curl --retry 3 --retry-delay 2 -fL \
            "https://huggingface.co/LunarOilRig/paddleocr-onnx/resolve/main/PP-OCRv5_mobile_det_onnx_infer.tar" \
            -o /tmp/ppocr-models/det.tar
          curl --retry 3 --retry-delay 2 -fL \
            "https://huggingface.co/LunarOilRig/paddleocr-onnx/resolve/main/PP-OCRv5_mobile_rec_onnx_infer.tar" \
            -o /tmp/ppocr-models/rec.tar
          mkdir -p /tmp/ppocr-models/det /tmp/ppocr-models/rec
          tar -xf /tmp/ppocr-models/det.tar -C /tmp/ppocr-models/det
          tar -xf /tmp/ppocr-models/rec.tar -C /tmp/ppocr-models/rec
          DET=$(find /tmp/ppocr-models/det -type f -name inference.onnx | head -n 1)
          REC=$(find /tmp/ppocr-models/rec -type f -name inference.onnx | head -n 1)
          YAML=$(find /tmp/ppocr-models/rec -type f -name inference.yml | head -n 1)
          test -n "$DET" && test -n "$REC" && test -n "$YAML"
          cp "$DET" ppocr-sdk/src/main/assets/models/det/inference.onnx
          cp "$REC" ppocr-sdk/src/main/assets/models/rec/inference.onnx
          cp "$YAML" ppocr-sdk/src/main/assets/models/rec/inference.yml
          echo "Detection model: $(du -h ppocr-sdk/src/main/assets/models/det/inference.onnx)"
          echo "Recognition model: $(du -h ppocr-sdk/src/main/assets/models/rec/inference.onnx)"
          test -s ppocr-sdk/src/main/assets/models/det/inference.onnx
          test -s ppocr-sdk/src/main/assets/models/rec/inference.onnx

      - name: Configure project for PaddleOCR SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("settings.gradle.kts")
          s = p.read_text()
          if 'include(":ppocr-sdk")' not in s:
              s += '\ninclude(":ppocr-sdk")\n'
          p.write_text(s)
          p = Path("build.gradle.kts")
          s = p.read_text().replace('id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
                                    'id("org.jetbrains.kotlin.android") version "2.1.0" apply false')
          p.write_text(s)
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n','')
          if 'implementation(project(":ppocr-sdk"))' not in s:
              s = s.replace('dependencies {', 'dependencies {\n    implementation(project(":ppocr-sdk"))\n    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")')
          # Keep OpenCVLoader visible during app compilation and align OpenCV versions.
          s = s.replace('dependencies {', 'dependencies {\n    implementation("com.quickbirdstudios:opencv:4.5.3.0")', 1) if 'implementation("com.quickbirdstudios:opencv:4.5.3.0")' not in s else s
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBarcodeMVP-PP-OCRv5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
